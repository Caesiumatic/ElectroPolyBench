[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "electropolybench"
version = "0.1.0"
description = "Retrospective active-learning replay for electropolymerization experiments"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "electropoly-active-compute contributors" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["electropolybench", "data"]

[tool.setuptools.package-dir]
"electropolybench" = "src/electropolybench"
"data" = "data"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
