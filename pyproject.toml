[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "electropolybench"
version = "0.1.0"
description = "Retrospective active-learning benchmark seed for electropolymerization / OMIEC materials"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ElectroPolyBench contributors" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

# NOTE: BoTorch / Ax are the planned v2 upgrade for principled multi-objective
# and multi-fidelity Bayesian optimization. They are intentionally NOT required
# for v1 — the whole point of the seed is to prove the retrospective-replay
# harness with a minimal, easy-to-install scikit-learn stack.
[project.optional-dependencies]
v2 = ["botorch", "ax-platform", "gpytorch", "torch"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["electropolybench", "data"]

[tool.setuptools.package-dir]
"electropolybench" = "src/electropolybench"
"data" = "data"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
